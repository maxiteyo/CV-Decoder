[project]
name = "nombre-del-proyecto"
version = "0.1.0"
description = "Una línea describiendo el proyecto."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "jupyter>=1.0.0",
    "ipykernel>=6.22.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.4.0",
    # Agregá acá las dependencias reales de tu proyecto
    # (y sacá las de arriba que no uses).
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = []
